name: extension

on:
  push:
    branches: [main]
    # GitHub skips path filters for tag pushes, so every release tag runs.
    tags: [extension-v*]
    # Docs don't change the build.
    paths: [extension/**, '!extension/**/*.md', .github/workflows/extension.yml]
  pull_request:
    paths: [extension/**, '!extension/**/*.md', .github/workflows/extension.yml]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: |
          version=$(jq -r .version extension/package.json)
          if [ "$GITHUB_REF_NAME" != "extension-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: extension/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - run: pnpm -C extension install --frozen-lockfile
      - run: pnpm -C extension test
      - run: pnpm -C extension check
      - run: pnpm -C extension zip

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/extension-v')
        with:
          name: zips
          path: extension/.output/*.zip
          if-no-files-found: error

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/extension-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zips

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rating Projector ${GITHUB_REF_NAME#extension-v}" \
            --generate-notes \
            *.zip
